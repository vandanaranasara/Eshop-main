version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  django_app:
    build: .
    container_name: django_app
    command: >
      sh -c "sleep 10 && python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - MYSQL_DB=${MYSQL_DB}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=db
    volumes:
      - .:/app
      - ./uploads:/uploads  

  redis:
    image: redis:latest
    container_name: eshop_redis
    ports:
      - "6379:6379"
  
  celery:
    build: .
    container_name: eshop_celery
    command: celery -A Eshop worker --pool=solo -l info
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

volumes:
  mysql_data:
  media_data:

